# ──────────────────────────────────────────────────────────────
# Tubu Tree — Production stack (1 VM, GCP Compute Engine).
# Postgres + Redis + API (NestJS) + Web (Next.js) + Caddy (auto-HTTPS).
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Biến lấy từ file .env cùng thư mục (xem .env.production.example).
# ──────────────────────────────────────────────────────────────
# Docker mặc định json-file KHÔNG xoay vòng: một sự cố kéo dài (Redis down log ECONNREFUSED liên tục,
# webhook ghi log mỗi request) có thể làm đầy đĩa và kéo sập Postgres. Tối đa 5 × 10MB mỗi container.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tubu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?đặt POSTGRES_PASSWORD trong .env}
      POSTGRES_DB: ${POSTGRES_DB:-tubutree}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-tubu} -d ${POSTGRES_DB:-tubutree}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [tubu]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    # BullMQ bắt buộc noeviction (Redis chỉ chứa job queue). Ghi rõ để không ai thêm maxmemory kèm policy LRU. 150mb giống
    # docker-compose.vietnix.yml: go-live:check cảnh báo redis.maxmemory khi không đặt trần; đầy thì lệnh ghi lỗi OOM chứ không xoá key.
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory', '150mb', '--maxmemory-policy', 'noeviction']
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [tubu]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    # Worker BullMQ chờ job đang chạy xong khi tắt (gọi Pancake tối đa 15s): mặc định 10s của Docker sẽ SIGKILL
    # giữa chừng. Lệnh tạo đơn đã có tra cứu chống trùng, đây chỉ để deploy không cắt ngang lệnh đang gửi.
    stop_grace_period: 30s
    logging: *default-logging
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3001
      # Cron/Date local theo giờ VN (cron còn có timeZone riêng, xem apps/api/src/common/cron-tz.ts).
      TZ: Asia/Ho_Chi_Minh
      # Trỏ về service nội bộ — GHI ĐÈ giá trị trong .env. Pool giống docker-compose.vietnix.yml (mặc định của Prisma theo số CPU, cạn khi tải bùng nổ: P2028).
      DATABASE_URL: postgresql://${POSTGRES_USER:-tubu}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tubutree}?connection_limit=20&pool_timeout=30
      REDIS_URL: redis://redis:6379
      THROTTLE_BYPASS_TOKEN: ${THROTTLE_BYPASS_TOKEN:-}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    # Healthcheck gọi /api/health → caddy chỉ proxy khi app thực sự sẵn sàng (tránh 502 lúc khởi động).
    healthcheck:
      test: ['CMD-SHELL', 'node -e "fetch(\"http://localhost:3001/api/health\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [tubu]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # NEXT_PUBLIC_* nhúng lúc build → phải truyền qua build args.
        NEXT_PUBLIC_API_BASE_URL: https://api.${WEB_DOMAIN}/api
        NEXT_PUBLIC_SITE_URL: https://app.${WEB_DOMAIN}
        NEXT_PUBLIC_TENANT_ROOT_DOMAIN: ${WEB_DOMAIN}
        # ZALO_APP_ID = App ID của Zalo App trên developers.zalo.me (đăng nhập web OAuth). ZALO_MINIAPP_ID = ID của Mini App, chỉ dùng cho link zalo.me/s/<id>. Hai giá trị khác nhau.
        NEXT_PUBLIC_ZALO_APP_ID: ${ZALO_APP_ID:-}
        NEXT_PUBLIC_ZALO_MINIAPP_ID: ${ZALO_MINIAPP_ID:-}
        NEXT_PUBLIC_ZALO_OA_ID: ${ZALO_OA_ID:-}
        NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
        NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET: ${CLOUDINARY_UPLOAD_PRESET:-}
        # Rỗng = web không nạp SDK lỗi. DSN phía trình duyệt nằm trong bundle nên là DSN công khai theo thiết kế của Sentry.
        NEXT_PUBLIC_SENTRY_DSN: ${SENTRY_DSN:-}
        NEXT_PUBLIC_SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}
        # Để trống ở production: build web dừng nếu ZALO_APP_ID hoặc ZALO_MINIAPP_ID rỗng, hoặc hai giá trị trùng nhau. Chỉ đặt 1 cho bản thử không dùng Zalo.
        ALLOW_EMPTY_ZALO_APP_ID: ${ALLOW_EMPTY_ZALO_APP_ID:-}
    restart: unless-stopped
    logging: *default-logging
    environment:
      NODE_ENV: production
      PORT: 3000
      # Docker tự set HOSTNAME=<container id>; Next.js standalone server.js đọc process.env.HOSTNAME
      # làm địa chỉ bind thay vì mặc định 0.0.0.0 — bind nhầm vào IP container trên bridge network,
      # khiến "localhost" bên trong container (kể cả healthcheck dưới) không kết nối được dù app
      # chạy đúng (port-map ngoài vẫn hoạt động vì NAT route thẳng vào IP bridge). Ép 0.0.0.0.
      HOSTNAME: '0.0.0.0'
      # Server-runtime override (xem apps/web/src/lib/api.ts) — SSR/ISR fetch (getProducts,
      # getBrand, getStorefront...) gọi thẳng qua Docker network nội bộ thay vì đi vòng ra
      # domain công khai qua Caddy. Không set thì các hàm đó fallback NEXT_PUBLIC_API_BASE_URL
      # (đã inline lúc build = domain public) — vẫn chạy được, chỉ tốn 1 hop mạng ngoài.
      API_BASE_URL: http://api:3001/api
      # Cùng giá trị với api: SSR gửi qua header x-throttle-bypass để không bị 429 theo IP máy chủ web.
      THROTTLE_BYPASS_TOKEN: ${THROTTLE_BYPASS_TOKEN:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}
    depends_on:
      api:
        condition: service_healthy
    # Next.js standalone không có endpoint health riêng → ping root '/'.
    healthcheck:
      test: ['CMD-SHELL', 'node -e "fetch(\"http://localhost:3000/\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [tubu]

  zalo-bridge:
    build:
      context: .
      dockerfile: apps/zalo-bridge/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    # Không env_file: client Zalo không chính thức không được thấy các khoá khác trong .env. Dùng :- (không :?) để thiếu khoá chỉ làm riêng bridge thoát lỗi, không chặn compose của api/web.
    environment:
      NODE_ENV: production
      PORT: 3110
      HOST: 0.0.0.0
      ZALO_BRIDGE_SECRET: ${ZALO_BRIDGE_SECRET:-}
      ZALO_BRIDGE_CREDENTIALS_KEY: ${ZALO_BRIDGE_CREDENTIALS_KEY:-}
      ZALO_BRIDGE_DATA_DIR: /data
      API_EVENTS_URL: http://api:3001/api/internal/zalo-bridge/events
    volumes:
      - zalo_bridge_data:/data
    # Không có ports: chỉ api trong mạng tubu gọi tới (Bearer ZALO_BRIDGE_SECRET). /health vẫn 200 khi chờ quét QR.
    healthcheck:
      test: ['CMD-SHELL', 'node -e "fetch(\"http://localhost:3110/health\",{headers:{authorization:\"Bearer \"+process.env.ZALO_BRIDGE_SECRET}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [tubu]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *default-logging
    ports:
      - '80:80'
      - '443:443'
    environment:
      WEB_DOMAIN: ${WEB_DOMAIN:?đặt WEB_DOMAIN trong .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    # Chờ api & web healthy thật sự (đã pass /api/health, '/') trước khi mở 80/443 → tránh 502 lúc cold start.
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    networks: [tubu]

volumes:
  pg_data:
  redis_data:
  zalo_bridge_data:
  caddy_data:
  caddy_config:

networks:
  tubu:
