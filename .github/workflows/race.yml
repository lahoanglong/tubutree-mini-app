name: Race suite

# Bộ test race chạy trên Postgres THẬT (không mock Prisma): tiền, Điểm Xanh, flash sale, idempotency, huỷ/trả đơn song song...
# chỉ được bảo vệ ở đây, ci.yml (jest, mock) không phủ. DB phải tên `tubutree_it`: apps/api/test/integration-race/setup-env.ts
# từ chối chạy trên DB khác. Chạy khi PR đụng API, hằng đêm (03:00 giờ VN) và bằng tay.
on:
  workflow_dispatch: {}
  pull_request:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'packages/shared-types/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/race.yml'
  schedule:
    - cron: '0 20 * * *'

permissions:
  contents: read

concurrency:
  group: race-${{ github.ref }}
  cancel-in-progress: true

jobs:
  race:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Một job nối tiếp trên runner 2 vCPU vượt 60 phút; chia 3 phần, mỗi phần có Postgres service riêng.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tubu
          POSTGRES_PASSWORD: tubu
          POSTGRES_DB: tubutree_it
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tubu -d tubutree_it"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Prisma mặc định mở num_cpus*2+1 = 5 kết nối trên runner 2 vCPU; ca race giữ khoá ở vài giao dịch song song
      # rồi truy vấn pg_stat_activity nên cạn pool ("Timed out fetching a new connection").
      DATABASE_URL: postgresql://tubu:tubu@localhost:5432/tubutree_it?schema=public&connection_limit=20&pool_timeout=30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build shared-types và Prisma generate
        run: |
          pnpm --filter @tubutree/shared-types build
          pnpm --filter @tubutree/api exec prisma generate

      - name: Áp migration lên DB tubutree_it
        run: pnpm --filter @tubutree/api exec prisma migrate deploy

      - name: Kiểm schema khớp migration (drift)
        run: >-
          pnpm --filter @tubutree/api exec prisma migrate diff
          --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code

      - name: Race suite (nối tiếp, Postgres thật, phần ${{ matrix.shard }}/3)
        working-directory: apps/api
        run: npx jest -c test/integration-race/jest.config.js --runInBand --shard=${{ matrix.shard }}/3
