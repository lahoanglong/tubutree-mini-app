name: Dump API logs (VM)

# Lấy log API gần đây để chẩn đoán. Chạy: gh workflow run logs.yml
on:
  workflow_dispatch: {}

jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - name: SSH dump logs
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          command_timeout: 3m
          script: |
            cd ~/tubutree
            DC="docker compose -f docker-compose.prod.yml"
            echo "===== CADDY: request /api/auth hoặc /api/products gần đây (10m) ====="
            $DC logs caddy --since 10m 2>&1 | grep -iE "api.tubutree.com|/auth|/products|/cart|/me" | tail -40 || echo "(Caddy không thấy request /api — có thể domain bị Zalo chặn)"
            echo ""
            echo "===== API: lỗi gần đây (10m) ====="
            $DC logs api --since 10m 2>&1 | grep -iE "zalo|auth|graph|verify|unauthor|error|exception" | tail -40 || echo "(không có lỗi)"
