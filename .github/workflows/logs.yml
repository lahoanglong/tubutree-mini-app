name: Dump API logs (VM)

# Lấy log API gần đây để chẩn đoán. Chạy: gh workflow run logs.yml
on:
  workflow_dispatch: {}

jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - name: SSH dump logs
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          command_timeout: 3m
          script: |
            cd ~/tubutree
            DC="docker compose -f docker-compose.prod.yml"
            echo "===== API: MỌI request (HTTP) + lỗi gần đây (10m) ====="
            $DC logs api --since 10m 2>&1 | grep -iE "\[HTTP\]|GET |POST |zalo|auth|graph|verify|unauthor|error|exception" | tail -60 || echo "(KHÔNG có request nào tới API → domain bị Zalo chặn)"
