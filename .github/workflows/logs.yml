name: Dump API logs (VM)

# Lấy log API gần đây để chẩn đoán. Chạy: gh workflow run logs.yml
on:
  workflow_dispatch: {}

# Least-privilege GITHUB_TOKEN: workflow chỉ SSH ra VM bằng secrets riêng.
permissions:
  contents: read

jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - name: Chặn workflow VM cũ (cần biến repo VM_WORKFLOWS_ENABLED=true)
        # Các secret VM_* từng trỏ VM GCP đã đóng. Workflow này có thể đã bị trỏ nhầm sang VPS Vietnix: deploy.yml chạy git pull + deploy.sh,
        # smoke*.yml ghi user thử vào DB thật. Chỉ bật biến sau khi đã kiểm VM_HOST/VM_USER/VM_SSH_KEY và biết mình đang chạy gì.
        if: ${{ vars.VM_WORKFLOWS_ENABLED != 'true' }}
        run: |
          echo "::error::Workflow này đang bị khoá để không chạy nhầm lên máy chủ thật. Nếu chủ ý chạy: kiểm VM_HOST, VM_USER, VM_SSH_KEY đã trỏ đúng máy, rồi đặt biến repo VM_WORKFLOWS_ENABLED=true (Settings > Secrets and variables > Actions > Variables)."
          exit 1
      - name: SSH dump logs
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          command_timeout: 3m
          script: |
            cd "${{ vars.DEPLOY_DIR || '/opt/tubutree' }}"
            DC="docker compose -f ${{ vars.COMPOSE_FILE || 'docker-compose.vietnix.yml' }}"
            echo "===== API: DIAG client + lỗi gần đây (20m) ====="
            $DC logs api --since 20m 2>&1 | grep -iE "DIAG|CLIENT|fail|zalo-ok|tokenLen|WARN|error|exception|getAccessToken|zmpLogin" | tail -50 || echo "(không có)"
