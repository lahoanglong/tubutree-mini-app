name: Deploy API to VM

# Push lên main đụng tới API/packages/compose → tự SSH vào máy chủ build lại.
# Cần 3 secret (Settings → Secrets and variables → Actions):
#   VM_HOST     = IP máy chủ đang chạy (VPS Vietnix: 14.225.207.177)
#   VM_USER     = user SSH trên máy đó
#   VM_SSH_KEY  = private key (toàn bộ nội dung file id_ed25519) có public key đã thêm vào ~/.ssh/authorized_keys
# và 2 biến repo (Settings → Variables), có mặc định cho VPS Vietnix:
#   DEPLOY_DIR   = thư mục repo trên máy chủ (mặc định /opt/tubutree)
#   COMPOSE_FILE = compose đang dùng (mặc định docker-compose.vietnix.yml)
#
# Gate bằng workflow_run: chỉ deploy SAU KHI workflow "CI" trên main pass.
# Lý do chọn workflow_run thay vì `needs: ci`: ci.yml và deploy.yml là 2 workflow
# riêng (path filter của deploy khác CI), không thể `needs:` cross-workflow.
#
# Trigger tự động (workflow_run) VẪN CỐ Ý TẮT: deploy hiện làm bằng tay theo
# ops/README-vietnix-deploy.md (git bundle lên VPS). Trước khi bật lại: (1) trỏ DNS + hạ tầng ổn
# định trên 1 host duy nhất, (2) cập nhật 3 secret VM_* trỏ đúng host đó (đến 2026-10 chúng vẫn
# trỏ VM GCP đã đóng), (3) máy chủ pull được từ origin.
on:
  workflow_dispatch: {}
  # workflow_run:
  #   workflows: ["CI"]
  #   branches: [main]
  #   types: [completed]

# 2 lần trigger workflow_dispatch chồng nhau (vd bấm Run workflow 2 lần liên tiếp) không được
# chạy song song trên cùng VM — pg_dump/git pull/docker compose up --build race nhau có thể
# tạo backup hỏng hoặc deploy nửa vời. cancel-in-progress: false → xếp hàng, KHÔNG huỷ deploy
# đang chạy dở (huỷ giữa chừng git pull/docker build còn nguy hiểm hơn).
concurrency:
  group: deploy-production
  cancel-in-progress: false

# Least-privilege GITHUB_TOKEN: deploy chỉ SSH ra VM bằng secrets riêng, không dùng GITHUB_TOKEN để ghi.
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Chỉ chạy khi CI xanh (bỏ qua khi CI fail/cancelled). workflow_dispatch luôn cho chạy.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Backup DB trước migrate
        # Dump postgres ra /var/backups/tubutree trước khi build/deploy mới (bản có points_1d còn được deploy.sh backup lại sau khi dừng API).
        # Nếu deploy hỏng → bash tools/backup/restore-db.sh <file>.sql.gz (xem tools/backup/README.md).
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -euo pipefail
            cd "${{ vars.DEPLOY_DIR || '/opt/tubutree' }}"
            sudo mkdir -p /var/backups/tubutree
            sudo chown $(id -u):$(id -g) /var/backups/tubutree
            POSTGRES_USER=$(grep -E '^POSTGRES_USER=' .env 2>/dev/null | cut -d= -f2- || true)
            POSTGRES_DB=$(grep -E '^POSTGRES_DB=' .env 2>/dev/null | cut -d= -f2- || true)
            COMPOSE_FILE="${{ vars.COMPOSE_FILE || 'docker-compose.vietnix.yml' }}" POSTGRES_USER="${POSTGRES_USER:-tubu}" POSTGRES_DB="${POSTGRES_DB:-tubutree}" \
              bash tools/backup/backup-db.sh

      - name: Ghi image đang chạy để quay lại
        # Compose build image local (không push registry), nên điểm quay lại là IMAGE đang chạy chứ không phải commit.
        # Làm đúng như bước 2 của docs/launch/deploy-rollback-runbook.md: ghi `.rollback-images` và gắn thẻ `:rollback`
        # (giữ cho `docker image prune` không xoá mất image cũ). Quay lại theo mục 7 của runbook: 7.2 chỉ quay image, chỉ
        # đúng khi schema sau migrate vẫn tương thích với image cũ; không thì 7.3 khôi phục bản backup.
        # KHÔNG checkout commit cũ (`.last-deployed-sha`) rồi chạy lại deploy.sh: script này không có ở commit cũ, và HEAD
        # tách rời làm `git pull --ff-only` của ops.yml lỗi. `.last-deployed-sha` chỉ để tham khảo.
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e
            cd "${{ vars.DEPLOY_DIR || '/opt/tubutree' }}"
            git rev-parse HEAD > .last-deployed-sha || true
            DC="docker compose -f ${{ vars.COMPOSE_FILE || 'docker-compose.vietnix.yml' }}"
            if [ -z "$($DC ps -q api)" ] || [ -z "$($DC ps -q web)" ]; then
              echo "api hoặc web chưa chạy: không có image để ghi làm điểm quay lại"
              exit 0
            fi
            API_ID=$(docker inspect -f '{{.Image}}' "$($DC ps -q api)"); API_NAME=$(docker inspect -f '{{.Config.Image}}' "$($DC ps -q api)")
            WEB_ID=$(docker inspect -f '{{.Image}}' "$($DC ps -q web)"); WEB_NAME=$(docker inspect -f '{{.Config.Image}}' "$($DC ps -q web)")
            printf 'API_ID=%s\nAPI_NAME=%s\nWEB_ID=%s\nWEB_NAME=%s\n' "$API_ID" "$API_NAME" "$WEB_ID" "$WEB_NAME" > .rollback-images
            docker tag "$API_ID" "${API_NAME%%:*}:rollback"
            docker tag "$WEB_ID" "${WEB_NAME%%:*}:rollback"
            cat .rollback-images

      - name: SSH deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            # set -e: nếu `cd` hoặc `git pull` fail → DỪNG, KHÔNG build với tree CŨ
            # (trước đây không set -e → fail-silently rebuild bản cũ, deploy "thành công" mà không có code mới).
            set -euo pipefail
            cd "${{ vars.DEPLOY_DIR || '/opt/tubutree' }}"
            git pull --ff-only
            # build → kiểm .env + migrate bằng image mới → thay api → thay web (xem script vì sao thứ tự này).
            # deploy.sh thoát 2 (chưa build gì) khi bản có migration 20261015150000 mà API cũ còn chạy: làm tay theo runbook.
            # Bản có migration 20261018210000_points_1d (một chiều): deploy.sh tự build, dừng API, backup LẠI (bản ở bước đầu chạy trước
            # git pull và build nên thiếu mọi ghi trong lúc build), migrate, seed-reference, bật API. Backup lỗi thì bật lại API, chưa migrate.
            COMPOSE_FILE="${{ vars.COMPOSE_FILE || 'docker-compose.vietnix.yml' }}" bash tools/deploy/deploy.sh
