name: CI

# Trigger tự động BẬT LẠI 2026-09-18 — lý do tắt tạm 01/09 (VM prod down, đang test cục bộ)
# không còn: điển hình prod đã dựng lại (VPS Vietnix, xem docs/2026-09-12-deploy-runbook.md
# mục 4.3) và baseline hiện tại xanh toàn bộ (typecheck/lint/test đã verify lại 2026-09-18).
# Vẫn chạy tay được qua workflow_dispatch khi cần (tab Actions → CI → Run workflow).
on:
  workflow_dispatch: {}
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege GITHUB_TOKEN: workflow chỉ checkout + build/test, không push/comment/release.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          # jsdom@30 (apps/web test) gọi undici's CacheStorage polyfill cần
          # `webidl.util.markAsUncloneable` — API nội bộ Node không có ở Node 20 trên runner
          # GitHub Actions, dù package.json ghi "node": ">=20" và chạy được trên máy dev (Node 22+).
          # Lockfile cũng resolve chain jsdom/vitest dựa trên @types/node@22. Nâng CI lên 22 để
          # khớp đúng môi trường lockfile đã build, không phải hạ cấp gói.
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm db:generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        # Unit test (loại @tubutree/e2e — Playwright cần DB + dev server, chạy riêng ở e2e.yml).
        run: pnpm test:ci

      - name: Build
        run: pnpm build
