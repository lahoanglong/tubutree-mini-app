name: CI

# Trigger tự động (push/pull_request) TẮT TẠM THỜI 2026-09-01 — VM prod đang down, đang
# test cục bộ trước khi bật lại CI/CD. Vẫn chạy tay được qua workflow_dispatch (tab Actions
# → CI → Run workflow). Bật lại tự động: bỏ comment 2 mục push/pull_request bên dưới.
on:
  workflow_dispatch: {}
  # push:
  #   branches: [main]
  # pull_request:
  #   branches: [main]

# Least-privilege GITHUB_TOKEN: workflow chỉ checkout + build/test, không push/comment/release.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm db:generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        # Unit test (loại @tubutree/e2e — Playwright cần DB + dev server, chạy riêng ở e2e.yml).
        run: pnpm test:ci

      - name: Build
        run: pnpm build
