name: Playwright E2E Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# Least-privilege GITHUB_TOKEN: chỉ checkout + upload-artifact (không cần quyền ghi repo/PR).
permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    # 1. Cài đặt pnpm
    - uses: pnpm/action-setup@v4
      with:
        version: 9.15.9

    # 2. Cài đặt Node.js
    - uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: 'pnpm'

    # 3. Cài đặt Dependencies cho Monorepo
    - name: Install dependencies
      run: pnpm install

    # 4. Cài đặt trình duyệt Playwright
    - name: Install Playwright Browsers
      run: pnpm --filter @tubutree/e2e exec playwright install --with-deps

    # 5. Khởi chạy Database (Postgres :5434) + Redis (:6381) qua Docker Compose.
    #    --wait: chờ container đạt trạng thái healthy (postgres có healthcheck pg_isready
    #    trong docker-compose.dev.yml) trước khi bước tiếp — tránh `prisma migrate deploy`
    #    chạy khi Postgres còn đang khởi động (CI flaky ngẫu nhiên).
    - name: Start Database
      run: docker compose -f docker-compose.dev.yml up -d --wait --wait-timeout 90

    # 6. Tạo apps/api/.env cho CI (.env bị gitignore). Chỉ DATABASE_URL + JWT bắt buộc lúc boot
    #    (env.validation.ts: webhook fail-closed CHỈ khi NODE_ENV=production → dùng test).
    #    global-setup.ts đọc file này để ký JWT test khớp secret API dùng.
    - name: Prepare API env (CI)
      run: |
        cat > apps/api/.env <<EOF
        NODE_ENV=test
        PORT=3111
        DATABASE_URL=postgresql://tubu:tubu@localhost:5434/tubutree
        REDIS_URL=redis://localhost:6381
        JWT_ACCESS_SECRET=ci-access-secret-$(openssl rand -hex 16)
        JWT_REFRESH_SECRET=ci-refresh-secret-$(openssl rand -hex 16)
        EOF

    # 7. Prisma: generate client + áp migration lên DB CI (API dev cần schema sẵn để boot).
    - name: Prisma migrate + generate
      run: |
        pnpm --filter @tubutree/api exec prisma generate
        pnpm --filter @tubutree/api exec prisma migrate deploy

    # 7a. Thể lệ Đổi rác cho ca e2e /doi-rac/quy-dinh: trang dựng phía máy chủ web (ISR) khi API trả 200 nên mock trình duyệt không tới;
    #     ghi đúng chữ spec dùng vào DB CI trước khi build. Hàm chỉ ghi khi GITHUB_ACTIONS=true và đúng DB CI, không ghi được thì bước này đỏ.
    - name: Seed waste rules text for e2e
      working-directory: apps/api
      env:
        DATABASE_URL: postgresql://tubu:tubu@localhost:5434/tubutree
      run: |
        pnpm exec tsx -e "const w = require('../e2e/tests/support/waste-db'); w.seedWasteRulesText(w.WASTE_RULES_TEXT).then((ok) => { if (!ok) { console.error('waste.rules_text chưa ghi vì DB không phải DB CI'); process.exit(1); } })"

    # 7b. Partial unique index (khoá chống cộng tiền/điểm/xu trùng) chỉ có trong migration SQL,
    #     Prisma schema không biểu diễn được — kiểm DB vừa migrate có đủ, thiếu thì fail CI.
    - name: Check partial unique indexes
      run: pnpm --filter @tubutree/api exec tsx prisma/check-partial-indexes.ts

    # 8. Build toàn bộ dự án (shared-types cần build trước khi API/web dev import được).
    - name: Build Monorepo
      run: pnpm build

    # 9. Chạy Playwright — webServer trong playwright.config.ts TỰ start API/web/miniapp rồi chờ health.
    - name: Run Playwright tests
      run: pnpm --filter @tubutree/e2e test
      env:
        TEST_JWT_TOKEN: ${{ secrets.TEST_JWT_TOKEN }}

    # 8. Upload báo cáo nếu test rớt
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: apps/e2e/playwright-report/
        retention-days: 30
