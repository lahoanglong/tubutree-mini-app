name: Smoke purchase flow (VM)

# Test luồng MUA HÀNG tới bước báo giá với token thật: thêm giỏ → xem giỏ → tạo địa chỉ → quote,
# rồi dọn lại giỏ và địa chỉ vừa tạo. Chạy: gh workflow run smoke-purchase.yml
#
# CỐ Ý KHÔNG gọi /checkout/place-order: trên PROD đơn COD là đơn thật (đẩy Pancake, trừ kho, kho
# đóng gói, lẫn vào doanh thu). Luồng đặt đơn được kiểm bằng e2e/race spec trên DB thử, không ở đây.
# Token là của user cố định `dev-test-user` (scripts/dev-token.ts upsert, không tạo user mới mỗi lần).
on:
  workflow_dispatch: {}

# Least-privilege GITHUB_TOKEN: workflow chỉ SSH ra VM bằng secrets riêng.
permissions:
  contents: read

jobs:
  purchase:
    runs-on: ubuntu-latest
    steps:
      - name: SSH purchase smoke
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          command_timeout: 5m
          script: |
            cd "${{ vars.DEPLOY_DIR || '/opt/tubutree' }}"
            DC="docker compose -f ${{ vars.COMPOSE_FILE || 'docker-compose.vietnix.yml' }}"
            T=$($DC exec -T api sh -c "cd /app/apps/api && DEV_ROLE=CUSTOMER pnpm exec tsx scripts/dev-token.ts" | tail -1 | tr -d '\r\n')
            B="https://api.tubutree.com/api"
            H_AUTH="Authorization: Bearer $T"
            H_JSON="Content-Type: application/json"
            # Product response: top-level "id" (Product) đứng TRƯỚC "variations[].id" trong JSON
            # (Prisma include đẩy relation ra sau field scalar) → regex "first cuid-looking string"
            # luôn khớp nhầm id của Product. Dùng jq lấy đúng field thay vì mù quét text.
            command -v jq >/dev/null 2>&1 || sudo apt-get install -y jq >/dev/null 2>&1 || true
            VAR=$(curl -s "$B/products/serum-duong-am-visante" | jq -r '.variations[0].id // empty')
            echo "variation: $VAR"
            step() { printf "%-26s %s\n" "$1" "$2"; }
            C=$(curl -s -o /tmp/b -w "%{http_code}" -X POST "$B/cart/items" -H "$H_AUTH" -H "$H_JSON" -d "{\"variationId\":\"$VAR\",\"quantity\":2}"); step "POST /cart/items" "$C"; head -c 150 /tmp/b; echo
            C=$(curl -s -o /tmp/b -w "%{http_code}" "$B/cart" -H "$H_AUTH"); step "GET /cart" "$C"; grep -oE '"itemCount":[0-9]+|"subtotal":[0-9]+' /tmp/b
            ITEM=$(jq -r --arg v "$VAR" '.items[]? | select(.variationId == $v) | .id' /tmp/b | head -1)
            ADDR=$(curl -s -X POST "$B/me/addresses" -H "$H_AUTH" -H "$H_JSON" -d '{"recipient":"Smoke Test","phone":"0900000001","province":"TP HCM","district":"Q1","ward":"Bến Nghé","street":"1 Lê Lợi","provinceCode":"79","districtCode":"760","wardCode":"26734"}')
            AID=$(echo "$ADDR" | jq -r '.id // empty')
            step "POST /me/addresses" "id=$AID"
            C=$(curl -s -o /tmp/b -w "%{http_code}" -X POST "$B/checkout/quote" -H "$H_AUTH" -H "$H_JSON" -d "{\"addressId\":\"$AID\"}"); step "POST /checkout/quote" "$C"; grep -oE '"total":[0-9]+|"shippingFee":[0-9]+|"pointsEarned":[0-9]+' /tmp/b
            # Dọn: user smoke không giữ giỏ/địa chỉ giữa các lần chạy.
            [ -n "$ITEM" ] && { C=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE "$B/cart/items/$ITEM" -H "$H_AUTH"); step "DELETE /cart/items" "$C"; }
            [ -n "$AID" ] && { C=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE "$B/me/addresses/$AID" -H "$H_AUTH"); step "DELETE /me/addresses" "$C"; }
            echo "=== DONE (không đặt đơn; đã dọn giỏ và địa chỉ smoke) ==="
