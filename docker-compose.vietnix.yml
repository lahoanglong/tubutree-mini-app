# ──────────────────────────────────────────────────────────────
# Tubu Tree — deploy TẠM trên VPS Vietnix dùng CHUNG với ChoDeli (2026-09-12).
#
# Khác docker-compose.prod.yml ở 4 chỗ, vì máy này KHÔNG phải VM riêng:
#   1. KHÔNG có service `caddy` — cổng 80/443 đã do Apache aaPanel (WordPress) giữ.
#      api/web chỉ bind ra 127.0.0.1 (không lộ ra ngoài); Apache aaPanel sẽ reverse-proxy
#      vào 2 cổng này cho api.tubutree.com / app.tubutree.com — xem hướng dẫn kèm theo.
#   2. Cổng host CỐ TÌNH lệch xa dải ChoDeli đang dùng (3000/3003/3004/5435) để không đụng.
#   3. `mem_limit` mọi service — máy đang chia RAM với ChoDeli + WordPress/MariaDB, giới hạn
#      cứng để một lượt traffic tăng đột biến của Tubu Tree không kéo sập ChoDeli và ngược lại.
#      Tổng ngân sách ~2.3GB, để lại ~2GB+ cho ChoDeli/WordPress/hệ điều hành trên máy 7.8GB.
#   4. `cpus` cho api và web — trần CPU cùng lý do với mem_limit. Mặc định <= 1 lõi vì Docker TỪ CHỐI khởi động container
#      khi cpus lớn hơn số vCPU của máy; máy có nhiều vCPU thì nâng trong .env (không sửa file này: sửa file trên VPS làm
#      `git status` bẩn và dừng bước 1 của runbook deploy). Khuyến nghị cho VPS từ 8 vCPU: API_CPUS=2  WEB_CPUS=1 (chạy `nproc` để chắc)
#      Trần chỉ giới hạn mức dùng tối đa, không giữ chỗ; có hiệu lực khi api/web được tạo lại ở deploy.
#      postgres và redis CỐ Ý không có `cpus`/`shm_size`: `deploy.sh` chạy `up -d --no-build api` không kèm --no-deps nên
#      compose tạo lại cả hai service này nếu cấu hình của chúng đổi (5xx vài chục giây, BullMQ mất kết nối). Muốn thêm thì
#      tạo lại chủ động ngoài giờ cao điểm TRƯỚC deploy: `docker compose -f docker-compose.vietnix.yml up -d --no-deps postgres redis`.
#
# Khi có VM/VPS riêng: quay lại dùng docker-compose.prod.yml (có Caddy, không giới hạn RAM).
# ──────────────────────────────────────────────────────────────
# Docker mặc định json-file KHÔNG xoay vòng: một sự cố kéo dài (Redis down log ECONNREFUSED liên tục,
# webhook ghi log mỗi request) có thể làm đầy đĩa và kéo sập Postgres. Tối đa 5 × 10MB mỗi container.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 512m
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tubu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?đặt POSTGRES_PASSWORD trong .env}
      POSTGRES_DB: ${POSTGRES_DB:-tubutree}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-tubu} -d ${POSTGRES_DB:-tubutree}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [tubu]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 192m
    # noeviction là yêu cầu bắt buộc của BullMQ: Redis chỉ chứa job queue (không có cache), nên mọi key
    # đều là dữ liệu — allkeys-lru từng có thể xoá âm thầm job đang chờ retry (huỷ vận đơn Gomdon, retry
    # ZNS không có cron cứu). Đầy 150MB thì lệnh ghi lỗi OOM ngay, enqueue rơi về cron reconcile và
    # /api/health vẫn báo được; theo dõi bằng `redis-cli info memory` (used_memory_human).
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory', '150mb', '--maxmemory-policy', 'noeviction']
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [tubu]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    # Worker BullMQ chờ job đang chạy xong khi tắt (gọi Pancake tối đa 15s): mặc định 10s của Docker sẽ SIGKILL
    # giữa chừng. Lệnh tạo đơn đã có tra cứu chống trùng, đây chỉ để deploy không cắt ngang lệnh đang gửi.
    stop_grace_period: 30s
    logging: *default-logging
    mem_limit: 768m
    cpus: ${API_CPUS:-1.0}
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3001
      # Cron/Date local theo giờ VN (cron còn có timeZone riêng, xem apps/api/src/common/cron-tz.ts).
      TZ: Asia/Ho_Chi_Minh
      # Một instance API; pool mặc định của Prisma theo số CPU nên dễ cạn khi tải bùng nổ (P2028). 20 kết nối nằm
      # xa dưới max_connections=100 của Postgres, pool_timeout dài hơn để request xếp hàng thay vì lỗi 500.
      DATABASE_URL: postgresql://${POSTGRES_USER:-tubu}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tubutree}?connection_limit=20&pool_timeout=30
      REDIS_URL: redis://redis:6379
      THROTTLE_BYPASS_TOKEN: ${THROTTLE_BYPASS_TOKEN:-}
    ports:
      - '127.0.0.1:14001:3001' # Apache aaPanel proxy_pass vào đây cho api.tubutree.com
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ['CMD-SHELL', 'node -e "fetch(\"http://localhost:3001/api/health\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [tubu]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: https://api.${WEB_DOMAIN}/api
        NEXT_PUBLIC_SITE_URL: https://app.${WEB_DOMAIN}
        NEXT_PUBLIC_TENANT_ROOT_DOMAIN: ${WEB_DOMAIN}
        NEXT_PUBLIC_ZALO_APP_ID: ${ZALO_APP_ID:-}
        NEXT_PUBLIC_ZALO_OA_ID: ${ZALO_OA_ID:-}
        NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
        NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET: ${CLOUDINARY_UPLOAD_PRESET:-}
        # Rỗng = web không nạp SDK lỗi. DSN phía trình duyệt nằm trong bundle nên là DSN công khai theo thiết kế của Sentry.
        NEXT_PUBLIC_SENTRY_DSN: ${SENTRY_DSN:-}
        NEXT_PUBLIC_SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}
        # Để trống ở production: build web dừng nếu ZALO_APP_ID rỗng. Chỉ đặt 1 cho bản thử không dùng Zalo.
        ALLOW_EMPTY_ZALO_APP_ID: ${ALLOW_EMPTY_ZALO_APP_ID:-}
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 512m
    cpus: ${WEB_CPUS:-1.0}
    environment:
      NODE_ENV: production
      PORT: 3000
      # Next standalone mặc định đóng kết nối rảnh sau 5 giây, trong khi Apache (ProxyPass ... ttl=30) tái dùng kết nối:
      # thỉnh thoảng trúng kết nối vừa chết → 502 lẻ. 55 giây lớn hơn ttl của Apache và nhỏ hơn headersTimeout 60 giây của
      # Node (Next không cho đặt headersTimeout). Tên biến do server.js của Next 14 đọc (KEEP_ALIVE_TIMEOUT, mili giây).
      KEEP_ALIVE_TIMEOUT: '55000'
      # Docker tự set HOSTNAME=<container id> cho mọi container; Next.js standalone server.js đọc
      # process.env.HOSTNAME làm địa chỉ bind thay vì mặc định 0.0.0.0 — bind nhầm vào IP container
      # trên bridge network, "localhost"/127.0.0.1 bên trong container không kết nối được (dù host
      # vẫn curl qua port-map bình thường vì NAT route thẳng vào IP bridge đó). Docker healthcheck
      # (node fetch http://localhost:3000/) vì vậy luôn "unhealthy" dù app chạy đúng. Ép 0.0.0.0.
      HOSTNAME: '0.0.0.0'
      API_BASE_URL: http://api:3001/api
      # Cùng giá trị với api: SSR gửi qua header x-throttle-bypass để không bị 429 theo IP máy chủ web.
      THROTTLE_BYPASS_TOKEN: ${THROTTLE_BYPASS_TOKEN:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}
    ports:
      - '127.0.0.1:14000:3000' # Apache aaPanel proxy_pass vào đây cho app.tubutree.com
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'node -e "fetch(\"http://localhost:3000/\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [tubu]

  zalo-bridge:
    build:
      context: .
      dockerfile: apps/zalo-bridge/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 256m
    # Không env_file: client Zalo không chính thức không được thấy các khoá khác trong .env. Dùng :- (không :?) để thiếu khoá chỉ làm riêng bridge thoát lỗi, không chặn compose của api/web.
    environment:
      NODE_ENV: production
      PORT: 3110
      HOST: 0.0.0.0
      ZALO_BRIDGE_SECRET: ${ZALO_BRIDGE_SECRET:-}
      ZALO_BRIDGE_CREDENTIALS_KEY: ${ZALO_BRIDGE_CREDENTIALS_KEY:-}
      ZALO_BRIDGE_DATA_DIR: /data
      API_EVENTS_URL: http://api:3001/api/internal/zalo-bridge/events
    volumes:
      - zalo_bridge_data:/data
    # Không có ports: chỉ api trong mạng tubu gọi tới (Bearer ZALO_BRIDGE_SECRET). /health vẫn 200 khi chờ quét QR.
    healthcheck:
      test: ['CMD-SHELL', 'node -e "fetch(\"http://localhost:3110/health\",{headers:{authorization:\"Bearer \"+process.env.ZALO_BRIDGE_SECRET}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [tubu]

volumes:
  pg_data:
  redis_data:
  zalo_bridge_data:

networks:
  tubu:
