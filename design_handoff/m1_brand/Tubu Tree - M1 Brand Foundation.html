<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tubu Tree — M1 Brand Foundation</title>
<link rel="stylesheet" href="tokens.css" />
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--neutral-100); font-family: var(--font-ui); color: var(--neutral-900); }
  .board { max-width: 1340px; margin: 0 auto; padding: 0 40px 100px; }
  /* cover */
  .cover { background: linear-gradient(160deg, var(--green-700), var(--green-900)); color: #fff; border-radius: 0 0 32px 32px; padding: 56px 56px 48px; margin-bottom: 8px; }
  .cover .kicker { font-size: 13px; font-weight: 600; letter-spacing: 1.5px; color: var(--sun-300); text-transform: uppercase; }
  .cover h1 { font-size: 44px; font-weight: 700; letter-spacing: -1px; margin: 14px 0 12px; line-height: 1.05; }
  .cover p { font-size: 16px; line-height: 1.6; max-width: 620px; color: rgba(255,255,255,0.82); margin: 0; }
  .cover .meta { display: flex; gap: 28px; margin-top: 28px; flex-wrap: wrap; }
  .cover .meta div { font-size: 13px; color: rgba(255,255,255,0.7); }
  .cover .meta b { display: block; font-size: 15px; color: #fff; font-weight: 600; margin-top: 3px; }
  .sw { display: inline-block; width: 13px; height: 13px; border-radius: 4px; vertical-align: -2px; margin-right: 5px; }

  section { margin-top: 64px; }
  .sec-head { border-left: 4px solid var(--green-600); padding-left: 16px; margin-bottom: 8px; }
  .sec-head .num { font-size: 13px; font-weight: 700; color: var(--green-600); letter-spacing: 1px; }
  .sec-head h2 { font-size: 27px; font-weight: 700; letter-spacing: -0.4px; margin: 4px 0 0; }
  .rationale { max-width: 760px; font-size: 14.5px; line-height: 1.65; color: var(--neutral-600); margin: 14px 0 0; padding-left: 20px; }
  .rationale b { color: var(--neutral-900); font-weight: 600; }

  .frames { display: flex; gap: 36px; flex-wrap: wrap; margin-top: 36px; align-items: flex-start; }
  .opt { display: flex; flex-direction: column; align-items: center; }
  .opt .tag { display: flex; flex-direction: column; align-items: center; gap: 5px; margin-bottom: 18px; text-align: center; max-width: 300px; }
  .opt .pill { font-size: 12px; font-weight: 700; letter-spacing: 0.5px; color: #fff; background: var(--green-600); padding: 5px 14px; border-radius: var(--r-full); }
  .opt .pill.b { background: var(--clay-500); }
  .opt h3 { font-size: 17px; font-weight: 700; margin: 4px 0 0; }
  .opt .desc { font-size: 13px; line-height: 1.5; color: var(--neutral-600); }
  .device-scale { transform: scale(0.86); transform-origin: top center; margin-bottom: -120px; }

  /* component showcase panels (cards, tabbars on neutral plate) */
  .plate { background: var(--neutral-50); border: 1px solid var(--neutral-200); border-radius: 20px; padding: 28px; box-shadow: var(--sh-sm); }
  .cardrow { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; width: 340px; }
  .barwrap { width: 390px; border: 1px solid var(--neutral-200); border-radius: 24px; overflow: hidden; box-shadow: var(--sh-md); background:#fff; }
  .barwrap .label { padding: 14px 18px; font-size: 12.5px; color: var(--neutral-500); background: var(--neutral-50); border-bottom: 1px solid var(--neutral-200); }
  .note { font-size: 12.5px; color: var(--neutral-500); margin-top: 14px; padding-left: 20px; font-style: italic; }
</style>
</head>
<body>
<div id="board"></div>

<!-- thumbnail for bundler -->
<template id="__bundler_thumbnail">
  <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><rect width="100" height="100" rx="20" fill="#509018"/><path d="M50 70V44" stroke="#fff" stroke-width="4" stroke-linecap="round"/><path d="M50 44c0-9 6-15 15-15 0 9-6 15-15 15z" fill="#F4B408"/><path d="M50 50c0-9-6-15-15-15 0 9 6 15 15 15z" fill="#fff"/></svg>
</template>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../image-slot.js"></script>
<script type="text/babel" src="../frames/ios-frame.jsx"></script>
<script type="text/babel" src="atoms.jsx"></script>
<script type="text/babel" src="components.jsx"></script>
<script type="text/babel" src="screens.jsx"></script>
<script type="text/babel" src="pdp.jsx"></script>

<script type="text/babel" data-presets="react">
const { useState: useStateB } = React;

function Device({ children }) {
  return <div className="device-scale"><IOSDevice>{children}</IOSDevice></div>;
}

/* a live tab bar that tracks active tab for the hero frames */
function LiveHero({ Hero, Card, Bar }) {
  const [tab, setTab] = useStateB('home');
  return <Hero Card={Card} bar={<Bar active={tab} onTab={setTab} />} />;
}

function Cover() {
  return (
    <div className="cover">
      <div className="kicker">Tubu Tree · Milestone 1</div>
      <h1>Brand Foundation</h1>
      <p>Nền tảng thương hiệu cho Zalo Mini App — “Sống xanh An Lành”. Ba phương án Home Hero, hai phương án ProductCard và hai phương án Bottom Tab Bar, kèm bảng màu &amp; type. Mọi màn render trên khung iPhone 402px, có tương tác cơ bản (đổi tab, thêm giỏ, đổi segment).</p>
      <div className="meta">
        <div>Primary<b><span style={{display:'inline-block',width:13,height:13,borderRadius:4,verticalAlign:-2,marginRight:5,background:'var(--orange-600)'}}></span>#E08C1C Cam (logo)</b></div>
        <div>Secondary<b><span style={{display:'inline-block',width:13,height:13,borderRadius:4,verticalAlign:-2,marginRight:5,background:'var(--green-600)'}}></span>#509018 Xanh lá</b></div>
        <div>Accent<b><span style={{display:'inline-block',width:13,height:13,borderRadius:4,verticalAlign:-2,marginRight:5,background:'var(--sun-500)'}}></span>#F4B408 Vàng (game)</b></div>
        <div>Nền<b><span style={{display:'inline-block',width:13,height:13,borderRadius:4,verticalAlign:-2,marginRight:5,background:'var(--neutral-50)',border:'1px solid #ddd'}}></span>#FAFAF8 Warm white</b></div>
        <div>Font<b>Plus Jakarta Sans + Inter</b></div>
      </div>
    </div>
  );
}

function ColorTypeSheet() {
  const ramp = (label, vars) => (
    <div style={{ marginBottom: 18 }}>
      <div style={{ fontSize: 12.5, fontWeight: 600, color: 'var(--neutral-600)', marginBottom: 8 }}>{label}</div>
      <div style={{ display: 'flex', gap: 0, borderRadius: 10, overflow: 'hidden', boxShadow: 'var(--sh-xs)' }}>
        {vars.map(([v, hex]) => (
          <div key={v} style={{ flex: 1, height: 64, background: hex, display: 'flex', alignItems: 'flex-end', padding: 6 }}>
            <span style={{ fontSize: 9.5, fontFamily: 'var(--font-mono)', color: parseInt(hex.slice(1,3),16) < 140 ? '#fff' : 'var(--neutral-900)' }}>{hex}</span>
          </div>
        ))}
      </div>
    </div>
  );
  const TypeRow = ({ cls, label, spec }) => (
    <div style={{ display: 'flex', alignItems: 'baseline', gap: 20, padding: '12px 0', borderBottom: '1px solid var(--neutral-200)' }}>
      <div style={{ width: 130, flex: '0 0 130px', fontSize: 12, color: 'var(--neutral-500)', fontFamily: 'var(--font-mono)' }}>{spec}</div>
      <div className={cls} style={{ flex: 1 }}>{label}</div>
    </div>
  );
  return (
    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 40 }}>
      <div className="plate">
        <h3 style={{ margin: '0 0 18px', fontSize: 16 }}>Bảng màu</h3>
        {ramp('Primary — Cam (logo)', [['50','#FDF3E3'],['100','#FBE4C4'],['200','#F4C98A'],['400','#EBA94A'],['600','#E08C1C'],['700','#B86A10'],['900','#5C3505']])}
        {ramp('Secondary — Xanh lá', [['50','#EEF7D9'],['100','#DCEFBE'],['200','#BBD98A'],['400','#95D222'],['600','#509018'],['700','#3C6D12'],['900','#1F3A09']])}
        {ramp('Accent — Vàng (game)', [['300','#F4B408'],['bright','#F0E004']])}
        {ramp('Neutral — Warm', [['0','#FFFFFF'],['50','#FAFAF8'],['100','#F2F2EF'],['200','#E5E5E0'],['400','#A8A8A0'],['600','#5F5F58'],['900','#1A1A17']])}
        {ramp('Semantic', [['success','#509018'],['warning','#E58B00'],['danger','#C73E3E'],['info','#3D7BB8']])}
        <p className="note" style={{ paddingLeft: 0 }}>Đỏ chỉ dùng cho lỗi/destructive — không dùng cho countdown/flash sale (theo brief).</p>
      </div>
      <div className="plate">
        <h3 style={{ margin: '0 0 8px', fontSize: 16 }}>Type scale — Plus Jakarta Sans</h3>
        <TypeRow cls="t-display-lg" spec="32 / 700" label="Sống xanh An Lành" />
        <TypeRow cls="t-h1" spec="24 / 700" label="Gợi ý cho bạn" />
        <TypeRow cls="t-h2" spec="20 / 600" label="Thương hiệu của vườn" />
        <TypeRow cls="t-h3" spec="18 / 600" label="Dầu gội Sâm Visante" />
        <TypeRow cls="t-body-lg" spec="16 / 400" label="Thiên nhiên Việt cho cả nhà mình" />
        <TypeRow cls="t-body-md" spec="14 / 400" label="Chiết xuất sâm Ngọc Linh, dịu nhẹ cho da" />
        <TypeRow cls="t-label" spec="12 / 500" label="AN TOÀN CHO BÉ" />
        <div style={{ marginTop: 16, padding: 14, background: 'var(--neutral-50)', borderRadius: 10, fontFamily: 'var(--font-body)', fontSize: 13.5, lineHeight: 1.6, color: 'var(--neutral-600)' }}>
          <b style={{ fontFamily: 'var(--font-ui)', color: 'var(--neutral-900)' }}>Inter</b> — dùng cho body dài (mô tả sản phẩm, điều khoản). Tubu Tree là một khu vườn an lành, không phải một siêu thị online vội vã.
        </div>
        <p className="note" style={{ paddingLeft: 0 }}>Tối thiểu 13px cho body; persona Bác Liên (58) bật scale 1.25× ở M3.</p>
      </div>
    </div>
  );
}

function Board() {
  return (
    <>
      <Cover />
      <div className="board">

        {/* SECTION 1 — HERO */}
        <section>
          <div className="sec-head"><div className="num">01 — HOME HERO</div><h2>Bố cục trang chủ · 3 phương án</h2></div>
          <p className="rationale">Cả ba đều mở bằng search + giỏ hàng, rồi <b>banner → carousel thương hiệu → “Gợi ý cho bạn”</b>, nhưng khác nhau ở trọng tâm. Cam <b>#E08C1C</b> dẫn dắt CTA &amp; trạng thái active; xanh lá <b>#509018</b> dành cho Vườn Xanh, an toàn &amp; thông điệp eco. Bấm thử tab bên dưới mỗi máy.</p>
          <div className="frames">
            <div className="opt">
              <div className="tag"><span className="pill">PHƯƠNG ÁN 1</span><h3>Khu vườn an lành</h3><span className="desc">Banner full-bleed có overlay tagline, carousel thương hiệu tròn, nhiều khoảng trắng — đậm chất “bước vào khu vườn”.</span></div>
              <Device><LiveHero Hero={Hero1} Card={ProductCardA} Bar={TabBarA} /></Device>
            </div>
            <div className="opt">
              <div className="tag"><span className="pill">PHƯƠNG ÁN 2</span><h3>Ưu tiên phân khúc</h3><span className="desc">Segment pills (“Cho mẹ &amp; bé”…) lên đầu + banner mềm dạng card, tối ưu cho Mẹ Linh dùng 1 tay.</span></div>
              <Device><LiveHero Hero={Hero2} Card={ProductCardA} Bar={TabBarA} /></Device>
            </div>
            <div className="opt">
              <div className="tag"><span className="pill">PHƯƠNG ÁN 3</span><h3>Nhiều lối vào</h3><span className="desc">Hàng quick-action (Vườn Xanh, Voucher, Ví, Cashback) + lưới 10 thương hiệu — giàu khám phá.</span></div>
              <Device><LiveHero Hero={Hero3} Card={ProductCardA} Bar={TabBarA} /></Device>
            </div>
          </div>
        </section>

        {/* SECTION 2 — PRODUCT CARD */}
        <section>
          <div className="sec-head"><div className="num">02 — PRODUCT CARD</div><h2>Thẻ sản phẩm B2C · 2 phương án</h2></div>
          <p className="rationale">Cả hai đều có: <b>chip thương hiệu, tên 2 dòng, rating, giá + giá gốc gạch, nút thêm giỏ</b>. Lưới 2 cột. Bấm nút thêm để xem toast.</p>
          <div className="frames">
            <div className="opt">
              <div className="tag"><span className="pill">PHƯƠNG ÁN A</span><h3>Ảnh to · giá nhỏ dưới</h3><span className="desc">Ảnh tràn viền, chip thương hiệu nổi trên ảnh, nút thêm tròn gọn. Đẹp, thoáng, ưu tiên hình ảnh sản phẩm thật.</span></div>
              <div className="plate"><div className="cardrow" id="cards-a"></div></div>
            </div>
            <div className="opt">
              <div className="tag"><span className="pill b">PHƯƠNG ÁN B</span><h3>Giá + rating nổi bật</h3><span className="desc">Ảnh vừa, badge rating vàng nổi, giá lớn, nút “Thêm vào giỏ” full-width — đẩy mạnh chuyển đổi.</span></div>
              <div className="plate"><div className="cardrow" id="cards-b"></div></div>
            </div>
          </div>
        </section>

        {/* SECTION 3 — TAB BAR */}
        <section>
          <div className="sec-head"><div className="num">03 — BOTTOM TAB BAR</div><h2>Thanh điều hướng · 2 phương án</h2></div>
          <p className="rationale">5 tab: Trang chủ · Danh mục · <b>Vườn Xanh</b> · Ví &amp; Hoa hồng · Cá nhân. Vườn Xanh là tâm điểm game. Bấm để đổi tab.</p>
          <div className="frames">
            <div className="opt">
              <div className="tag"><span className="pill">PHƯƠNG ÁN A</span><h3>Icon + label đầy đủ</h3><span className="desc">Luôn hiện nhãn, tab giữa nhô lên dạng nút lá nổi — rõ ràng cho mọi lứa tuổi (gồm Bác Liên 58).</span></div>
              <div className="barwrap"><div className="label">Luôn hiện nhãn · nút giữa nổi</div><div id="bar-a"></div></div>
            </div>
            <div className="opt">
              <div className="tag"><span className="pill b">PHƯƠNG ÁN B</span><h3>Nhãn chỉ khi active</h3><span className="desc">Icon gọn, tab đang chọn bung ra pill có nhãn — hiện đại, nhiều chỗ thở.</span></div>
              <div className="barwrap"><div className="label">Pill bung khi chọn</div><div id="bar-b"></div></div>
            </div>
          </div>
        </section>

        {/* SECTION 4 — PDP */}
        <section>
          <div className="sec-head"><div className="num">04 — BONUS</div><h2>Màn chi tiết sản phẩm (PDP)</h2></div>
          <p className="rationale">Mẫu để thấy brand “sống” trên màn thật: gallery ảnh, badge an toàn, strip thương hiệu, mô tả (font Inter), và <b>thanh mua cố định</b> ở đáy. Chỉnh số lượng &amp; bấm Mua ngay để xem tương tác.</p>
          <div className="frames">
            <div className="opt"><Device><PDP /></Device></div>
            <div style={{ flex: 1, minWidth: 280, paddingTop: 20 }}>
              <ul style={{ fontSize: 14, lineHeight: 1.9, color: 'var(--neutral-600)', paddingLeft: 18, maxWidth: 380 }}>
                <li>CTA chính <b>Mua ngay</b> dùng xanh đặc; <b>Thêm giỏ</b> là outline xanh — phân cấp rõ.</li>
                <li>Badge an toàn (An toàn cho bé · Thuần chay · Không paraben) đặt ngay dưới tên, đúng nhu cầu Mẹ Linh.</li>
                <li>Không countdown đỏ; “-20%” dùng tông đất sét, không gây áp lực.</li>
                <li>Ô ảnh là placeholder — bạn kéo ảnh thật vào sau, hoặc tôi gắn từ list 50 SP.</li>
              </ul>
            </div>
          </div>
        </section>

        {/* SECTION 5 — COLOR & TYPE */}
        <section>
          <div className="sec-head"><div className="num">05 — FOUNDATION</div><h2>Bảng màu &amp; Type scale</h2></div>
          <p className="rationale">Token đã chốt: <b>Primary cam #E08C1C</b> (CTA/active) + <b>Secondary xanh #509018</b> (Vườn Xanh, an toàn, eco). Đây là phần tôi sẽ mở rộng thành Design System đầy đủ ở M2.</p>
          <div style={{ marginTop: 28 }}><ColorTypeSheet /></div>
        </section>

        <div style={{ marginTop: 64, padding: 28, background: 'var(--green-50)', borderRadius: 20, border: '1px solid var(--green-100)' }}>
          <h2 style={{ margin: '0 0 10px', fontSize: 20, color: 'var(--green-900)' }}>Bước tiếp theo → chọn để khoá M1</h2>
          <p style={{ margin: 0, fontSize: 14.5, lineHeight: 1.7, color: 'var(--neutral-700)', maxWidth: 760 }}>
            Cho tôi biết: <b>Hero</b> (1/2/3), <b>ProductCard</b> (A/B), <b>Tab bar</b> (A/B). Khi bạn chốt, tôi chuyển sang <b>M2 — Design System v0.5</b> (Buttons, Inputs/OTP, Badges, Chips, ProductCard 3 mode B2C/CTV/Đại lý, PriceTag, Order timeline, và các empty state rổ tre / vườn trống / wishlist).
          </p>
        </div>
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('board')).render(<Board />);

/* mount card + bar showcases after first paint */
function add(){}
setTimeout(() => {
  const mount = (id, el) => { const n = document.getElementById(id); if (n) ReactDOM.createRoot(n).render(el); };
  mount('cards-a', <>{PRODUCTS.slice(0,2).map((p,i)=><ProductCardA key={i} p={p} onAdd={add} />)}</>);
  mount('cards-b', <>{PRODUCTS.slice(0,2).map((p,i)=><ProductCardB key={i} p={p} onAdd={add} />)}</>);
  const BarA = () => { const [t,setT]=useStateB('garden'); return <TabBarA active={t} onTab={setT} />; };
  const BarB = () => { const [t,setT]=useStateB('home'); return <TabBarB active={t} onTab={setT} />; };
  mount('bar-a', <BarA />);
  mount('bar-b', <BarB />);
}, 400);
</script>
</body>
</html>
