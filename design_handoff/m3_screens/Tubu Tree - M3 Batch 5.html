<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tubu Tree — M3 Batch 5 · Cashback & Common</title>
<link rel="stylesheet" href="../m1/tokens.css" />
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--neutral-100); color: var(--neutral-900); font-family: var(--font-ui); }
  .cover { background: linear-gradient(155deg, #235F3D, #509018 60%, #95D222); color: #fff; padding: 52px 48px 42px; border-radius: 0 0 32px 32px; }
  .cover .kick { font-size: 13px; font-weight: 700; letter-spacing: 1.6px; color: rgba(255,255,255,0.85); text-transform: uppercase; }
  .cover h1 { font-family: var(--font-display); font-size: 44px; font-weight: 800; letter-spacing: -1px; margin: 12px 0 10px; }
  .cover p { font-size: 15.5px; line-height: 1.6; max-width: 660px; margin: 0; color: rgba(255,255,255,0.92); }
  .wrap { max-width: 1480px; margin: 0 auto; padding: 0 40px 120px; }
  .grid { display: flex; flex-wrap: wrap; gap: 44px 36px; margin-top: 52px; justify-content: center; }
  .cell { display: flex; flex-direction: column; align-items: center; }
  .cell .tag { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
  .cell .num { font-family: var(--font-mono); font-size: 12px; font-weight: 700; color: #fff; background: var(--green-600); width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; }
  .cell h3 { font-family: var(--font-display); font-size: 17px; font-weight: 700; margin: 0; }
  .cell .sub { font-size: 12.5px; color: var(--neutral-500); }
  .frame-scale { transform: scale(0.82); transform-origin: top center; margin-bottom: -158px; }
  image-slot { --is-bg: var(--green-50); }
</style>
</head>
<body>
<div class="cover">
  <div class="kick">Tubu Tree · Milestone 3 · Batch 5</div>
  <h1>Cashback &amp; Common</h1>
  <p>6 màn còn lại hoàn tất 25 màn P1: hoàn tiền đối tác, hồ sơ cá nhân, hộp thông báo, cài đặt (có cỡ chữ cho Bác Liên), và 2 màn trạng thái 404 / mất kết nối với minh hoạ ấm áp.</p>
</div>
<div class="wrap"><div class="grid" id="grid"></div></div>
<template id="__bundler_thumbnail">
  <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><rect width="100" height="100" rx="20" fill="#509018"/><circle cx="50" cy="42" r="16" fill="#fff"/><rect x="30" y="64" width="40" height="8" rx="4" fill="#fff"/><rect x="36" y="78" width="28" height="6" rx="3" fill="rgba(255,255,255,.6)"/></svg>
</template>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../image-slot.js"></script>
<script type="text/babel" src="../frames/ios-frame.jsx"></script>
<script type="text/babel" src="../m1/atoms.jsx"></script>
<script type="text/babel" src="b1-shared.jsx"></script>
<script type="text/babel" src="b5-screens.jsx"></script>
<script type="text/babel" src="b5-flow.jsx"></script>
<script type="text/babel" data-presets="react">
const SCREENS = [
  ['20', 'Cashback', 'Grid đối tác 3 cột + % hoàn', 'cashback'],
  ['21', 'Cá nhân', 'Hồ sơ · hạng · menu', 'profile'],
  ['22', 'Thông báo', 'Tabs + danh sách + unread', 'notif'],
  ['23', 'Cài đặt', 'Toggle + cỡ chữ a11y', 'settings'],
  ['24', 'Lỗi 404', 'Chú chim · trang lạc đường', 'e404'],
  ['25', 'Mất kết nối', 'Offline state', 'offline'],
];
function Board() {
  return <>{SCREENS.map(([num, title, sub, initial]) => (
    <div className="cell" key={num}>
      <div className="tag"><span className="num">{num}</span><div><h3>{title}</h3><div className="sub">{sub}</div></div></div>
      <div className="frame-scale"><IOSDevice><B5Flow initial={initial} /></IOSDevice></div>
    </div>
  ))}</>;
}
ReactDOM.createRoot(document.getElementById('grid')).render(<Board />);
</script>
</body>
</html>
