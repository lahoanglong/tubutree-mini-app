<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tubu Tree — M3 Batch 3 · Wallet & Affiliate</title>
<link rel="stylesheet" href="../m1/tokens.css" />
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--neutral-100); color: var(--neutral-900); font-family: var(--font-ui); }
  .cover { background: linear-gradient(155deg, #1A3A5C, #2D6FA8 60%, #63B3ED); color: #fff; padding: 52px 48px 42px; border-radius: 0 0 32px 32px; }
  .cover .kick { font-size: 13px; font-weight: 700; letter-spacing: 1.6px; color: rgba(255,255,255,0.85); text-transform: uppercase; }
  .cover h1 { font-family: var(--font-display); font-size: 44px; font-weight: 800; letter-spacing: -1px; margin: 12px 0 10px; }
  .cover p { font-size: 15.5px; line-height: 1.6; max-width: 660px; margin: 0; color: rgba(255,255,255,0.92); }
  .cover .hint { margin-top: 20px; display: inline-flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.16); border: 1px solid rgba(255,255,255,0.28); padding: 9px 15px; border-radius: 999px; font-size: 13px; font-weight: 600; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 0 40px 120px; }
  .grid { display: flex; flex-wrap: wrap; gap: 44px 36px; margin-top: 52px; justify-content: center; }
  .cell { display: flex; flex-direction: column; align-items: center; }
  .cell .tag { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
  .cell .num { font-family: var(--font-mono); font-size: 12px; font-weight: 700; color: #fff; background: #2D6FA8; width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; }
  .cell h3 { font-family: var(--font-display); font-size: 17px; font-weight: 700; margin: 0; }
  .cell .sub { font-size: 12.5px; color: var(--neutral-500); }
  .frame-scale { transform: scale(0.82); transform-origin: top center; margin-bottom: -158px; }
  image-slot { --is-bg: var(--green-50); }
</style>
</head>
<body>
<div class="cover">
  <div class="kick">Tubu Tree · Milestone 3 · Batch 3</div>
  <h1>Wallet &amp; Affiliate</h1>
  <p>Ví tích hợp (rút tiền / Xu Tubu / đang chờ) + Dashboard hoa hồng CTV đầy đủ (chart 30 ngày, KPI, bậc CTV, top sản phẩm) + Share modal với caption gợi ý và ước tính hoa hồng.</p>
  <div class="hint">Bấm "Chia sẻ kiếm hoa hồng" → mở Share modal</div>
</div>
<div class="wrap"><div class="grid" id="grid"></div></div>

<template id="__bundler_thumbnail">
  <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><rect width="100" height="100" rx="20" fill="#2D6FA8"/><rect x="22" y="38" width="56" height="34" rx="8" fill="#fff"/><rect x="22" y="28" width="56" height="12" rx="4" fill="#63B3ED"/><circle cx="38" cy="55" r="6" fill="#509018"/></svg>
</template>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../image-slot.js"></script>
<script type="text/babel" src="../frames/ios-frame.jsx"></script>
<script type="text/babel" src="../m1/atoms.jsx"></script>
<script type="text/babel" src="b1-shared.jsx"></script>
<script type="text/babel" src="b3-screens.jsx"></script>
<script type="text/babel" src="b3-flow.jsx"></script>

<script type="text/babel" data-presets="react">
const SCREENS = [
  ['14', 'Wallet Overview', 'Rút / Ví Tubu / Đang chờ + lịch sử', 'wallet', {}],
  ['15', 'Affiliate Dashboard', 'Hoa hồng BIG · chart 30 ngày · KPI', 'affiliate', {}],
  ['16', 'Share Product', 'Zalo · Copy link · QR · caption gợi ý', 'share', { id: 'visante' }],
];
function Board() {
  return <>{SCREENS.map(([num, title, sub, initial, params]) => (
    <div className="cell" key={num}>
      <div className="tag"><span className="num">{num}</span><div><h3>{title}</h3><div className="sub">{sub}</div></div></div>
      <div className="frame-scale"><IOSDevice><B3Flow initial={initial} initialParams={params} /></IOSDevice></div>
    </div>
  ))}</>;
}
ReactDOM.createRoot(document.getElementById('grid')).render(<Board />);
</script>
</body>
</html>
