# Hạ tầng dev cho monorepo Tubu Tree (mới).
# Dùng port 5434/6381 để cùng chạy song song với stack cũ mini_app/ (5433/6380).
# Khớp apps/api/.env.example.
services:
  postgres:
    image: postgres:16-alpine
    container_name: tubu_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: tubu
      POSTGRES_PASSWORD: tubu
      POSTGRES_DB: tubutree
    ports:
      - '5434:5432'
    volumes:
      - tubu_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tubu -d tubutree']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tubu_redis
    restart: unless-stopped
    ports:
      - '6381:6379'
    volumes:
      - tubu_redis_data:/data

volumes:
  tubu_pg_data:
  tubu_redis_data:
